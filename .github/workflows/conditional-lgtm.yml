name: Conditional LGTM

on:
  push:

permissions:
  contents: write

jobs:
  quality-checks:
    name: Run required checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run unit tests
        run: npm run test:unit

      - name: Run integration tests
        run: npm run test:integration

      - name: Run end-to-end tests
        run: npm run test:e2e

      - name: Build frontend
        run: npm run build

  publish-decision:
    name: Publish conditional LGTM
    needs: quality-checks
    if: ${{ always() }}
    runs-on: ubuntu-latest

    steps:
      - name: Publish decision to commit
        uses: actions/github-script@v7
        env:
          QUALITY_RESULT: ${{ needs.quality-checks.result }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const marker = '<!-- conditional-lgtm -->';
            const passed = process.env.QUALITY_RESULT === 'success';
            const status = passed ? '✅ Conditional LGTM' : '❌ Conditional LGTM withheld';
            const details = passed
              ? 'All required checks passed. Final acceptance remains subject to repository review and branch protection rules.'
              : 'One or more required checks failed. Final acceptance is blocked until the checks pass.';
            const body = `${marker}
            ## ${status}

            ${details}

            Checks: ESLint, unit tests, integration tests, end-to-end tests, and frontend build.

            [View workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`;

            const comments = await github.paginate(
              github.rest.repos.listCommentsForCommit,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                commit_sha: context.sha,
                per_page: 100
              }
            );
            const existing = comments.find((comment) => comment.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.repos.createCommitComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                commit_sha: context.sha,
                body
              });
            }
