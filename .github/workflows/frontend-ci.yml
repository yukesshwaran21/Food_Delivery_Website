
name: Food Delivery Frontend CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-and-build:
    name: Frontend Quality Checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # Run all Playwright tests and retain failure status
      - name: Run Playwright Tests
        id: playwright
        continue-on-error: true
        env:
          CI: true
          APPLITOOLS_API_KEY: ${{ secrets.APPLITOOLS_API_KEY }}
        run: |
          set +e
          npx playwright test --grep-invert "visual"
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      # Analyze failed Playwright tests using Gemini
      - name: Analyze Failures with Gemini AI
        id: ai-analysis
        if: ${{ always() && steps.playwright.outputs.exit_code != '0' }}
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-2.5-flash
        run: node scripts/analyze-failures.js

      # Preserve evidence for debugging
      - name: Upload Playwright Test Evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-evidence
          path: |
            frontend/test-results/
            frontend/playwright-report/
          if-no-files-found: warn
          retention-days: 7

      - name: Run ESLint
        run: npm run lint

      - name: Run Unit Tests
        run: npm run test:unit

      - name: Build Frontend
        run: npm run build

      # Ensure failed Playwright tests fail the overall workflow
      - name: Preserve Playwright Failure Status
        if: ${{ always() && steps.playwright.outputs.exit_code != '0' }}
        run: exit 1
