name: Food Delivery Frontend CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  quality-checks:
    name: AI-Assisted Quality Checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Prepare diagnostic directory
        run: mkdir -p test-results/ci

      - name: Run ESLint
        id: lint
        continue-on-error: true
        run: |
          set +e
          npm run lint 2>&1 | tee test-results/ci/lint.log
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Run Unit Tests
        id: unit
        continue-on-error: true
        run: |
          set +e
          npm run test:unit 2>&1 | tee test-results/ci/unit.log
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Run Integration Tests
        id: integration
        continue-on-error: true
        run: |
          set +e
          npm run test:integration 2>&1 | tee test-results/ci/integration.log
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Run End-to-End Tests
        id: e2e
        continue-on-error: true
        run: |
          set +e
          npm run test:e2e 2>&1 | tee test-results/ci/e2e.log
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Build Frontend
        id: build
        continue-on-error: true
        run: |
          set +e
          npm run build 2>&1 | tee test-results/ci/build.log
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Analyze All Results with Gemini AI
        id: ai-analysis
        if: ${{ always() }}
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.8-flash
          LINT_STATUS: ${{ steps.lint.outputs.exit_code }}
          UNIT_STATUS: ${{ steps.unit.outputs.exit_code }}
          INTEGRATION_STATUS: ${{ steps.integration.outputs.exit_code }}
          E2E_STATUS: ${{ steps.e2e.outputs.exit_code }}
          BUILD_STATUS: ${{ steps.build.outputs.exit_code }}
        run: node scripts/analyze-failures.js

      - name: Upload Quality Check and AI Reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: quality-check-and-ai-reports
          path: |
            frontend/test-results/ci/
            frontend/test-results/ai-failure-analysis.md
          if-no-files-found: warn
          retention-days: 7