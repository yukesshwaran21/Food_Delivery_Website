name: Food Delivery Frontend CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  quality-checks:
    name: AI-Assisted Quality Checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Check API documentation
        working-directory: backend
        run: npm run docs:api:check

      - name: Prepare diagnostic directory
        run: mkdir -p test-results/ci

      - name: Run ESLint
        id: lint
        run: npm run lint 2>&1 | tee test-results/ci/lint.log

      - name: Run Unit Tests
        id: unit
        run: npm run test:unit 2>&1 | tee test-results/ci/unit.log

      - name: Run Integration Tests
        id: integration
        run: npm run test:integration 2>&1 | tee test-results/ci/integration.log

      - name: Run End-to-End Tests
        id: e2e
        run: npm run test:e2e 2>&1 | tee test-results/ci/e2e.log

      - name: Build Frontend
        id: build
        run: npm run build 2>&1 | tee test-results/ci/build.log

      - name: Upload Quality Check and AI Reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: quality-check-and-ai-reports
          path: |
            frontend/test-results/ci/
            frontend/test-results/results.json
          if-no-files-found: warn

  ollama-failure-report:
    name: Report failed checks with Ollama
    needs: quality-checks
    if: ${{ always() && needs.quality-checks.result == 'failure' }}
    runs-on: ubuntu-latest

    steps:
      - name: Download quality check logs
        uses: actions/download-artifact@v4
        with:
          name: quality-check-and-ai-reports
          path: frontend/test-results

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama
        run: |
          ollama serve > "$RUNNER_TEMP/ollama.log" 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:11434/api/tags > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat "$RUNNER_TEMP/ollama.log"
          exit 1

      - name: Download Ollama model
        run: ollama pull qwen2.5:1.5b

      - name: Generate Ollama failure report
        working-directory: frontend
        env:
          OLLAMA_URL: http://127.0.0.1:11434
          OLLAMA_MODEL: qwen2.5:1.5b
        run: node scripts/report-ci-failures.js

      - name: Print Ollama failure report
        run: cat frontend/test-results/ci/ollama-failure-report.md

      - name: Upload Ollama failure report
        uses: actions/upload-artifact@v4
        with:
          name: ollama-ci-failure-report
          path: frontend/test-results/ci/ollama-failure-report.md